name = "cf-startup-api"
main = "src/index.ts"
compatibility_date = "2024-12-18"

[vars]
APP_ENV = "development"
ALLOWED_ORIGIN = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "cf-startup-db"
database_id = "replace-with-d1-database-id"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "APP_KV"
id = "replace-with-kv-namespace-id"

[[r2_buckets]]
binding = "FILE_BUCKET"
bucket_name = "cf-startup-files"
