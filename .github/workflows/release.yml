name: Production release

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Public HTTPS URL verified after promotion
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unimailbox-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify exact production source
        run: |
          pnpm scaffold doctor
          pnpm typecheck
          pnpm test
      - name: Build, bookmark, migrate, and promote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm release:production
      - name: Post-promotion smoke tests
        run: pnpm release:verify "${{ inputs.deployment_url }}"
      - name: Roll back Worker after failed post-promotion verification
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm release:rollback
      - name: Retain release manifest
        uses: actions/upload-artifact@v4
        with:
          name: production-manifest-${{ github.sha }}
          path: .wrangler/release/manifest.json
